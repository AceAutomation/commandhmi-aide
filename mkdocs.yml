site_name: CommandHMI Help
repo_url: https://github.com/AceAutomation/commandhmi-aide
edit_uri: edit/main/docs/
docs_dir: docs
use_directory_urls: false
theme:
  name: material
  language: en
  features:
  - navigation.indexes
  - navigation.top
  - search.highlight
  - content.code.copy
  - navigation.footer
  - content.action.edit
  palette:
  - scheme: default
    primary: blue
    toggle:
      icon: material/brightness-7
      name: Dark mode
  - scheme: slate
    primary: blue
    toggle:
      icon: material/brightness-4
      name: Light mode
markdown_extensions:
- tables
- attr_list
- md_in_html
- pymdownx.highlight:
    anchor_linenums: false
- pymdownx.superfences
- toc:
    permalink: true
plugins:
- search
- offline
- i18n:
    docs_structure: folder
    fallback_to_default: true
    reconfigure_material: true
    languages:
    - locale: en
      default: true
      name: English
      build: true
    - locale: it
      name: Italiano
